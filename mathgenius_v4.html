<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathGenius</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.8.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#ffffff;--bg2:#f5f5f7;--bg3:#ececec;
--text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;
--border:#e0e0e5;--accent:#1a73e8;--accent-bg:#e8f0fe;
--accent-dark:#1557b0;--success:#2e7d32;--success-bg:#e8f5e9;
--warn:#e65100;--warn-bg:#fff3e0;--danger:#880e4f;--danger-bg:#fce4ec;
--radius:12px;--radius-sm:8px;--radius-pill:24px;
--sidebar:52px;--font:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){
:root{
--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
--text:#f5f5f7;--text2:#aeaeb2;--text3:#636366;
--border:#38383a;--accent:#4da3ff;--accent-bg:#1a3a6b;
--accent-dark:#7dc4ff;--success:#4caf50;--success-bg:#1b3d1c;
--warn:#ff9800;--warn-bg:#3d2400;--danger:#f06292;--danger-bg:#3d0d20;
}
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;display:flex;flex-direction:column}
#app{display:flex;height:100vh;overflow:hidden}

#sb{width:var(--sidebar);display:flex;flex-direction:column;align-items:center;padding:10px 0 12px;gap:2px;border-right:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.slogo{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;margin-bottom:6px;cursor:pointer;flex-shrink:0;user-select:none}
.sl{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:18px;border:none;background:transparent;transition:background .15s,color .15s}
.sl:hover,.sl.on{background:var(--bg2);color:var(--text)}
.sbottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:4px}
.savatar{width:30px;height:30px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;user-select:none;border:1px solid var(--border)}

#wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0}
#chatzone{flex:1;overflow-y:auto;display:flex;flex-direction:column;scroll-behavior:smooth}
#chatzone::-webkit-scrollbar{width:4px}
#chatzone::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 20px;text-align:center}
#welcome h1{font-size:clamp(20px,4vw,28px);font-weight:400;margin-bottom:6px;letter-spacing:-.3px}
#welcome p{font-size:14px;color:var(--text2);margin-bottom:24px;max-width:400px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.chip{padding:7px 15px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
.chip:hover{background:var(--bg2);color:var(--text);border-color:var(--text3)}

#msglist{display:none;flex-direction:column;padding:16px 0 8px}
.mu{display:flex;justify-content:flex-end;padding:3px 16px}
.mub{background:var(--bg2);border-radius:18px 18px 3px 18px;padding:9px 14px;max-width:72%;font-size:14px;line-height:1.55;word-break:break-word;border:1px solid var(--border)}
.mb{display:flex;gap:10px;padding:3px 16px}
.mbav{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
.mbc{flex:1;font-size:14px;line-height:1.65;color:var(--text);padding-top:2px;min-width:0}
.steprow{font-size:13.5px;color:var(--text2);padding:2px 0;line-height:1.6}
.steprow b{color:var(--text)}
.ansrow{font-size:15px;font-weight:500;color:var(--accent-dark);margin-top:10px;padding:9px 13px;border-radius:var(--radius-sm);background:var(--accent-bg);display:flex;align-items:center;gap:6px}
.errtxt{color:var(--danger);font-size:13px}
.hint{font-size:12px;color:var(--text3);margin-top:5px}
.dottag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 9px;border-radius:10px;margin-bottom:5px;font-weight:500}
.te{background:var(--success-bg);color:var(--success)}.tm{background:var(--warn-bg);color:var(--warn)}.th{background:var(--danger-bg);color:var(--danger)}
.dots{display:flex;gap:5px;padding:6px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bop 1.1s infinite}
.dot:nth-child(2){animation-delay:.22s}.dot:nth-child(3){animation-delay:.44s}
@keyframes bop{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

#inputzone{padding:8px 14px 16px;border-top:1px solid var(--border)}
#diffrow{display:flex;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.db{padding:5px 13px;border-radius:var(--radius-pill);border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.db:hover{background:var(--bg2)}
.de{background:var(--success-bg);color:var(--success);border-color:var(--success)}.dm{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.dh{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
#irow{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 6px 6px 16px;transition:border-color .15s;background:var(--bg)}
#irow:focus-within{border-color:var(--accent)}
#qi{flex:1;border:none;background:transparent;font-size:14px;color:var(--text);outline:none;font-family:inherit;min-width:0}
#qi::placeholder{color:var(--text3)}
#sndbtn{width:34px;height:34px;border-radius:50%;border:none;background:var(--text);color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:opacity .15s}
#sndbtn:disabled{opacity:.25;cursor:default}

#histpane{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
#histpane.vis{display:flex}
.panehdr{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:10px}
.panehdr h2{font-size:15px;font-weight:500;flex:1}
.xbtn{width:30px;height:30px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:background .12s}
.xbtn:hover{background:var(--bg2)}
#hlist{flex:1;overflow-y:auto;padding:6px 10px}
.hitem{padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:background .12s}
.hitem:hover{background:var(--bg2)}
.hq{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm{font-size:11px;color:var(--text3);display:flex;gap:8px;align-items:center}
.nohi{text-align:center;padding:40px 16px;color:var(--text2);font-size:13px}

#namepane{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:center;justify-content:center}
#namepane.vis{display:flex}
.namecard{background:var(--bg);border-radius:var(--radius);padding:28px 24px;width:min(340px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.2)}
.namecard h2{font-size:18px;font-weight:500;margin-bottom:6px}
.namecard p{font-size:13px;color:var(--text2);margin-bottom:18px}
.nameinp{width:100%;padding:9px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.nameinp:focus{border-color:var(--accent)}
.namebtn{margin-top:12px;width:100%;padding:10px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:14px;font-family:inherit;cursor:pointer;transition:opacity .15s}
.namebtn:hover{opacity:.88}

@media(max-width:480px){
  #sb{width:44px}
  .slogo{width:30px;height:30px;font-size:13px}
  .sl{width:32px;height:32px;font-size:16px}
  .savatar{width:26px;height:26px}
  #welcome h1{font-size:20px}
  .chips{gap:6px}
  .chip{font-size:12px;padding:6px 12px}
  #msglist{padding:10px 0 4px}
  .mb,.mu{padding:3px 12px}
  #inputzone{padding:6px 10px 14px}
}
</style>
</head>
<body>
<div id="app">
  <div id="sb">
    <div class="slogo" onclick="newChat()" title="MathGenius">М</div>
    <button class="sl on" id="sl-home" onclick="newChat()" title="Новый чат" aria-label="Новый чат"><i class="ti ti-pencil" aria-hidden="true"></i></button>
    <button class="sl" id="sl-hist" onclick="openHist()" title="История" aria-label="История"><i class="ti ti-history" aria-hidden="true"></i></button>
    <div class="sbottom">
      <button class="sl" onclick="openName()" title="Имя" aria-label="Настроить имя"><i class="ti ti-user" aria-hidden="true"></i></button>
      <div class="savatar" id="av" onclick="openName()" title="Изменить имя"></div>
    </div>
  </div>
  <div id="wrap">
    <div id="chatzone">
      <div id="welcome">
        <h1 id="wtitle">Привет!</h1>
        <p>Введи любой пример, уравнение или задачу — решу пошагово</p>
        <div class="chips">
          <button class="chip" onclick="fill('7 * 8')">7 × 8</button>
          <button class="chip" onclick="fill('2x + 5 = 13')">2x + 5 = 13</button>
          <button class="chip" onclick="fill('sqrt(144)')">√144</button>
          <button class="chip" onclick="fill('log2(32)')">log₂(32)</button>
          <button class="chip" onclick="fill('sin(30)')">sin(30°)</button>
          <button class="chip" onclick="fill('треугольник 3 4 5')">Площадь △ 3,4,5</button>
          <button class="chip" onclick="fill('x^2 - 5x + 6 = 0')">x²−5x+6=0</button>
          <button class="chip" onclick="fill('20% от 350')">20% от 350</button>
          <button class="chip" onclick="fill('(2+3)*4 - 10/2')">Выражение</button>
          <button class="chip" onclick="fill('cos(60)')">cos(60°)</button>
        </div>
      </div>
      <div id="msglist"></div>
    </div>
    <div id="inputzone">
      <div id="diffrow">
        <button class="db de" id="de" onclick="setD('easy')">Начальная 1–4</button>
        <button class="db" id="dm" onclick="setD('medium')">Средняя 5–6</button>
        <button class="db" id="dh" onclick="setD('hard')">Старшая 7–11</button>
      </div>
      <div id="irow">
        <input id="qi" placeholder="Введи пример или задачу..." autocomplete="off" onkeydown="kd(event)" oninput="upd()"/>
        <button id="sndbtn" onclick="go()" disabled aria-label="Решить"><i class="ti ti-arrow-up" aria-hidden="true"></i></button>
      </div>
    </div>
    <div id="histpane">
      <div class="panehdr">
        <h2>История запросов</h2>
        <button class="xbtn" onclick="closeHist()" aria-label="Закрыть"><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>
      <div id="hlist"></div>
    </div>
  </div>
</div>

<div id="namepane">
  <div class="namecard">
    <h2>Как тебя зовут?</h2>
    <p>Буду обращаться по имени</p>
    <input class="nameinp" id="nameinp" type="text" placeholder="Твоё имя" maxlength="30" onkeydown="if(event.key==='Enter')saveName()"/>
    <button class="namebtn" onclick="saveName()">Сохранить</button>
  </div>
</div>

<script>
var diff='easy', hist=[], busy=false;
var DL={easy:'Начальная',medium:'Средняя',hard:'Старшая'};
var TC={easy:'te',medium:'tm',hard:'th'};
var userName='';

function initName(){
  var n=localStorage.getItem('mg_name')||'';
  userName=n;
  updateNameUI();
  if(!n)setTimeout(openName,600);
}

function updateNameUI(){
  var av=document.getElementById('av');
  var wt=document.getElementById('wtitle');
  if(userName){
    av.textContent=userName.charAt(0).toUpperCase();
    wt.textContent='Привет, '+userName+'!';
  } else {
    av.textContent='?';
    wt.textContent='Привет!';
  }
}

function openName(){
  document.getElementById('nameinp').value=userName;
  document.getElementById('namepane').classList.add('vis');
  setTimeout(function(){document.getElementById('nameinp').focus();},80);
}

function saveName(){
  var v=document.getElementById('nameinp').value.trim();
  userName=v;
  if(v)localStorage.setItem('mg_name',v);
  else localStorage.removeItem('mg_name');
  updateNameUI();
  document.getElementById('namepane').classList.remove('vis');
}

document.getElementById('namepane').addEventListener('click',function(e){
  if(e.target===this)document.getElementById('namepane').classList.remove('vis');
});

function setD(d){
  diff=d;
  ['easy','medium','hard'].forEach(function(x){
    var id=x==='easy'?'de':x==='medium'?'dm':'dh';
    var b=document.getElementById(id);
    b.className='db'+(x===d?' '+(x==='easy'?'de':x==='medium'?'dm':'dh'):'');
  });
}

function fill(t){document.getElementById('qi').value=t;upd();document.getElementById('qi').focus();}
function kd(e){if(e.key==='Enter'){e.preventDefault();go();}}
function upd(){document.getElementById('sndbtn').disabled=!document.getElementById('qi').value.trim()||busy;}

function newChat(){
  document.getElementById('welcome').style.display='';
  document.getElementById('msglist').style.display='none';
  document.getElementById('msglist').innerHTML='';
  document.getElementById('qi').value='';
  closeHist();upd();
}

function openHist(){
  var hl=document.getElementById('hlist');
  if(!hist.length){
    hl.innerHTML='<div class="nohi"><i class="ti ti-history" style="font-size:28px;display:block;margin:0 auto 8px;opacity:.3" aria-hidden="true"></i>История пуста</div>';
  } else {
    hl.innerHTML=hist.slice().reverse().map(function(h,i){
      var idx=hist.length-1-i;
      return '<div class="hitem" onclick="loadH('+idx+')"><div class="hq">'+esc(h.q)+'</div><div class="hm"><span class="dottag '+TC[h.diff]+'" style="font-size:11px;padding:1px 7px">'+DL[h.diff]+'</span><span>'+h.t+'</span></div></div>';
    }).join('');
  }
  document.getElementById('histpane').classList.add('vis');
}

function closeHist(){document.getElementById('histpane').classList.remove('vis');}
function loadH(i){fill(hist[i].q);setD(hist[i].diff);closeHist();}

function showMsgs(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('msglist').style.display='flex';
}

function addUser(t){
  showMsgs();
  var d=document.createElement('div');d.className='mu';
  d.innerHTML='<div class="mub">'+esc(t)+'</div>';
  document.getElementById('msglist').appendChild(d);sc();
}

function addThink(){
  showMsgs();
  var d=document.createElement('div');d.className='mb';d.id='thinking';
  d.innerHTML='<div class="mbav">М</div><div class="mbc"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  document.getElementById('msglist').appendChild(d);sc();
}

function removeThink(){var t=document.getElementById('thinking');if(t)t.remove();}

function addBot(html,d){
  var wrap=document.createElement('div');wrap.className='mb';
  wrap.innerHTML='<div class="mbav">М</div><div class="mbc"><span class="dottag '+TC[d]+'">'+DL[d]+'</span><br>'+html+'</div>';
  document.getElementById('msglist').appendChild(wrap);sc();
}

function sc(){var c=document.getElementById('chatzone');c.scrollTop=c.scrollHeight;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function go(){
  var inp=document.getElementById('qi');
  var q=inp.value.trim();
  if(!q||busy)return;
  busy=true;inp.value='';upd();
  var now=new Date();
  var t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  hist.push({q:q,diff:diff,t:t});
  addUser(q);addThink();
  var d=diff;
  setTimeout(function(){
    removeThink();
    addBot(solve(q,d),d);
    busy=false;upd();
  },320);
}

function fmt(n){
  if(typeof n!=='number'||!isFinite(n))return '?';
  if(Math.abs(n)<1e-12)n=0;
  if(Math.abs(n-Math.round(n))<1e-9)return String(Math.round(n));
  return parseFloat(n.toFixed(10)).toString();
}

function steps(arr,ans){
  var s=arr.map(function(x,i){return '<div class="steprow"><b>Шаг '+(i+1)+'.</b> '+esc(x)+'</div>';}).join('');
  return s+'<div class="ansrow"><i class="ti ti-check" aria-hidden="true"></i> Ответ: '+esc(ans)+'</div>';
}

function errMsg(m){
  return '<span class="errtxt"><i class="ti ti-alert-circle" aria-hidden="true"></i> '+esc(m)+'</span><div class="hint">Примеры: <code>2(x+3)=14</code> · <code>(x+1)^2=9</code> · <code>3/4 + 1/2</code> · <code>log_2(32)</code> · <code>sin(45°)</code> · <code>площадь круга r=5</code> · <code>20% от 350</code></div>';
}

var MATH_FUNCS={
  sqrt:function(x){return Math.sqrt(x);}, abs:function(x){return Math.abs(x);}, ln:function(x){return Math.log(x);},
  log:function(x){return Math.log10?Math.log10(x):Math.log(x)/Math.LN10;}, exp:function(x){return Math.exp(x);},
  sin:function(x,ctx){return Math.sin(ctx.degrees?x*Math.PI/180:x);}, cos:function(x,ctx){return Math.cos(ctx.degrees?x*Math.PI/180:x);},
  tan:function(x,ctx){return Math.tan(ctx.degrees?x*Math.PI/180:x);}, tg:function(x,ctx){return Math.tan(ctx.degrees?x*Math.PI/180:x);},
  cot:function(x,ctx){return 1/Math.tan(ctx.degrees?x*Math.PI/180:x);}, ctg:function(x,ctx){return 1/Math.tan(ctx.degrees?x*Math.PI/180:x);}
};

function normalizeMathText(raw){
  return String(raw).toLowerCase()
    .replace(/−|–|—/g,'-').replace(/×|·|∙/g,'*').replace(/÷/g,'/').replace(/(\d)\s*:\s*(\d)/g,'$1/$2').replace(/:/g,' ')
    .replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3')
    .replace(/½/g,'(1/2)').replace(/¼/g,'(1/4)').replace(/¾/g,'(3/4)')
    .replace(/,/g,'.').replace(/процентов|процента|процент/gi,'%')
    .replace(/икс/g,'x').replace(/уравнение|реши|решить|вычисли|посчитай|найди значение|сколько будет/gi,' ')
    .replace(/логарифм/gi,'log').replace(/корень из/gi,'sqrt')
    .replace(/\s+/g,' ').trim();
}

function tokenize(input){
  var s=normalizeMathText(input),t=[],i=0;
  while(i<s.length){
    var c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9.]/.test(c)){
      var st=i,dot=0;
      while(i<s.length&&/[0-9.]/.test(s[i])){if(s[i]==='.')dot++;i++;}
      var raw=s.slice(st,i); if(dot>1)throw new Error('Некорректное число '+raw);
      t.push({type:'num',value:parseFloat(raw),raw:raw}); continue;
    }
    if(/[a-zа-я_]/i.test(c)){
      var st2=i; while(i<s.length&&/[a-zа-я_0-9]/i.test(s[i]))i++;
      var id=s.slice(st2,i);
      var m=id.match(/^log_?(\d+(?:\.\d+)?)$/) || id.match(/^log(\d+(?:\.\d+)?)$/);
      if(m){t.push({type:'func',value:'logbase',base:parseFloat(m[1]),raw:id});continue;}
      if(MATH_FUNCS[id])t.push({type:'func',value:id,raw:id});
      else if(id==='pi'||id==='e')t.push({type:'const',value:id,raw:id});
      else if(id==='x')t.push({type:'var',value:'x',raw:id});
      else t.push({type:'word',value:id,raw:id});
      continue;
    }
    if('+-*/^()=%'.indexOf(c)>=0){t.push({type:c,value:c,raw:c});i++;continue;}
    throw new Error('Неизвестный символ: '+c);
  }
  return t;
}

function Parser(tokens,ctx){this.t=tokens.filter(function(x){return x.type!=='word';});this.i=0;this.ctx=ctx||{degrees:true};}
Parser.prototype.peek=function(){return this.t[this.i];};
Parser.prototype.eat=function(type){var p=this.peek();if(p&&p.type===type){this.i++;return p;}return null;};
Parser.prototype.expect=function(type){var p=this.eat(type);if(!p)throw new Error('Ожидалось '+type);return p;};
Parser.prototype.parse=function(){var n=this.expr();if(this.peek())throw new Error('Лишний токен '+this.peek().raw);return n;};
Parser.prototype.expr=function(){var n=this.term();while(this.peek()&&(this.peek().type==='+'||this.peek().type==='-')){var op=this.peek().type;this.i++;n={type:'bin',op:op,left:n,right:this.term()};}return n;};
Parser.prototype.startsPrimary=function(p){return p&&(p.type==='num'||p.type==='var'||p.type==='const'||p.type==='func'||p.type==='(');};
Parser.prototype.term=function(){var n=this.power();while(this.peek()){var p=this.peek();if(p.type==='*'||p.type==='/'){this.i++;n={type:'bin',op:p.type,left:n,right:this.power()};}
  else if(this.startsPrimary(p)){n={type:'bin',op:'*',left:n,right:this.power(),implicit:true};}
  else break;}return n;};
Parser.prototype.power=function(){var n=this.unary();if(this.eat('^'))n={type:'bin',op:'^',left:n,right:this.power()};return n;};
Parser.prototype.unary=function(){if(this.eat('+'))return this.unary();if(this.eat('-'))return {type:'unary',op:'-',arg:this.unary()};return this.postfix();};
Parser.prototype.postfix=function(){var n=this.primary();while(this.eat('%'))n={type:'percent',arg:n};return n;};
Parser.prototype.primary=function(){var p=this.peek();if(!p)throw new Error('Неожиданный конец выражения');
  if(this.eat('num'))return {type:'num',value:p.value,raw:p.raw};
  if(this.eat('var'))return {type:'var',name:'x'};
  if(this.eat('const'))return {type:'num',value:p.value==='pi'?Math.PI:Math.E,raw:p.value};
  if(this.eat('(')){var n=this.expr();this.expect(')');return n;}
  if(p.type==='func'){this.i++;var arg;if(this.eat('(')){arg=this.expr();this.expect(')');}else arg=this.unary();return {type:'func',name:p.value,base:p.base,arg:arg};}
  throw new Error('Неожиданный токен '+p.raw);
};

function astText(n){
  if(n.type==='num')return n.raw||fmt(n.value); if(n.type==='var')return 'x'; if(n.type==='percent')return astText(n.arg)+'%';
  if(n.type==='unary')return '-'+astText(n.arg); if(n.type==='func')return (n.name==='logbase'?'log_'+fmt(n.base):n.name)+'('+astText(n.arg)+')';
  if(n.type==='bin')return '('+astText(n.left)+' '+n.op+' '+astText(n.right)+')'; return '?';
}

function evalAst(n,ctx){
  if(n.type==='num')return n.value; if(n.type==='var')throw new Error('В выражении есть x; это похоже на уравнение');
  if(n.type==='percent')return evalAst(n.arg,ctx)/100; if(n.type==='unary')return -evalAst(n.arg,ctx);
  if(n.type==='func'){var a=evalAst(n.arg,ctx); if(n.name==='logbase')return Math.log(a)/Math.log(n.base); return MATH_FUNCS[n.name](a,ctx);}
  var l=evalAst(n.left,ctx),r=evalAst(n.right,ctx),v;
  if(n.op==='+')v=l+r; else if(n.op==='-')v=l-r; else if(n.op==='*')v=l*r; else if(n.op==='/')v=l/r; else if(n.op==='^')v=Math.pow(l,r);
  if(!isFinite(v))throw new Error('Получилось недопустимое число'); return v;
}

function parseExpression(s,ctx){return new Parser(tokenize(s),ctx).parse();}
function evalExpression(s,ctx){var ast=parseExpression(s,ctx);return {ast:ast,value:evalAst(ast,ctx)};}

function poly(c0,c1,c2){return [c0||0,c1||0,c2||0];}
function padd(a,b,k){k=k||1;return poly(a[0]+k*b[0],a[1]+k*b[1],a[2]+k*b[2]);}
function pmul(a,b){
  var r=[0,0,0,0,0]; for(var i=0;i<=2;i++)for(var j=0;j<=2;j++)r[i+j]+=a[i]*b[j];
  if(Math.abs(r[3])>1e-9||Math.abs(r[4])>1e-9)throw new Error('Поддерживаются уравнения до второй степени');
  return poly(r[0],r[1],r[2]);
}
function pscale(a,k){return poly(a[0]*k,a[1]*k,a[2]*k);}
function astToPoly(n,ctx){
  if(n.type==='num')return poly(n.value,0,0); if(n.type==='var')return poly(0,1,0);
  if(n.type==='percent')return pscale(astToPoly(n.arg,ctx),0.01); if(n.type==='unary')return pscale(astToPoly(n.arg,ctx),-1);
  if(n.type==='func')return poly(evalAst(n,ctx),0,0);
  var a=astToPoly(n.left,ctx),b=astToPoly(n.right,ctx);
  if(n.op==='+')return padd(a,b,1); if(n.op==='-')return padd(a,b,-1); if(n.op==='*')return pmul(a,b);
  if(n.op==='/'){if(Math.abs(b[1])>1e-9||Math.abs(b[2])>1e-9)throw new Error('Деление на выражение с x пока не поддержано');return pscale(a,1/b[0]);}
  if(n.op==='^'){
    var exp=evalAst(n.right,ctx); if(Math.abs(exp-Math.round(exp))>1e-9||exp<0||exp>2)throw new Error('Степень с x должна быть 0, 1 или 2');
    if(exp===0)return poly(1,0,0); if(exp===1)return a; return pmul(a,a);
  }
  throw new Error('Неизвестная операция');
}
function cleanCoef(x){return Math.abs(x)<1e-10?0:x;}
function polyLabel(c){
  c=c.map(cleanCoef); var parts=[];
  if(c[2])parts.push(fmt(c[2])+'x²'); if(c[1])parts.push(fmt(c[1])+'x'); if(c[0]||!parts.length)parts.push(fmt(c[0]));
  return parts.join(' + ').replace(/\+ -/g,'- ');
}

function solveEquation(q,ctx){
  var parts=q.split('='); if(parts.length!==2)return null;
  var left=parseExpression(parts[0],ctx),right=parseExpression(parts[1],ctx);
  var p=padd(astToPoly(left,ctx),astToPoly(right,ctx),-1).map(cleanCoef);
  var a=p[2],b=p[1],c=p[0],ss=['Переносим всё в левую часть: '+polyLabel(p)+' = 0'];
  if(Math.abs(a)<1e-10){
    if(Math.abs(b)<1e-10)return steps(ss.concat(Math.abs(c)<1e-10?'Тождество: верно при любом x':'Противоречие: константа не равна нулю'),Math.abs(c)<1e-10?'любое x':'решений нет');
    var x=-c/b; ss.push(fmt(b)+'x = '+fmt(-c)); ss.push('x = '+fmt(-c)+' / '+fmt(b)+' = '+fmt(x)); return steps(ss,'x = '+fmt(x));
  }
  ss.push('Это квадратное уравнение: a='+fmt(a)+', b='+fmt(b)+', c='+fmt(c));
  var D=b*b-4*a*c; ss.push('D = b² − 4ac = '+fmt(b*b)+' − 4·'+fmt(a)+'·'+fmt(c)+' = '+fmt(D));
  if(D< -1e-10){ss.push('D < 0, действительных корней нет');return steps(ss,'действительных корней нет');}
  if(Math.abs(D)<1e-10){var x0=-b/(2*a);ss.push('D = 0, один корень: x = −b/(2a) = '+fmt(x0));return steps(ss,'x = '+fmt(x0));}
  var sd=Math.sqrt(D),x1=(-b+sd)/(2*a),x2=(-b-sd)/(2*a);
  ss.push('√D = '+fmt(sd)); ss.push('x₁ = (−b + √D)/(2a) = '+fmt(x1)); ss.push('x₂ = (−b − √D)/(2a) = '+fmt(x2));
  return steps(ss,'x₁ = '+fmt(x1)+', x₂ = '+fmt(x2));
}

function nums(q){return (normalizeMathText(q).match(/[+-]?\d+(?:\.\d+)?/g)||[]).map(Number);}
function solvePercent(q){
  var s=normalizeMathText(q),m=s.match(/([+-]?\d+(?:\.\d+)?)\s*%\s*(?:от|из)\s*([+-]?\d+(?:\.\d+)?)/i)||s.match(/(?:найти|сколько)?\s*([+-]?\d+(?:\.\d+)?)\s*%\s+([+-]?\d+(?:\.\d+)?)/i);
  if(m){var p=+m[1],n=+m[2],r=p*n/100;return steps(['Процент — это сотая доля: '+fmt(p)+'% = '+fmt(p/100),fmt(p/100)+' · '+fmt(n)+' = '+fmt(r)],fmt(r));}
  m=s.match(/(?:увеличить|прибавить)\s*([+-]?\d+(?:\.\d+)?)\s*(?:на)?\s*([+-]?\d+(?:\.\d+)?)\s*%/i);
  if(m){var n1=+m[1],p1=+m[2],r1=n1*(1+p1/100);return steps(['Увеличение на '+fmt(p1)+'%: умножаем на 1 + '+fmt(p1/100),fmt(n1)+' · '+fmt(1+p1/100)+' = '+fmt(r1)],fmt(r1));}
  m=s.match(/(?:уменьшить|вычесть|скидк)\S*\s*([+-]?\d+(?:\.\d+)?)\s*(?:на)?\s*([+-]?\d+(?:\.\d+)?)\s*%/i);
  if(m){var n2=+m[1],p2=+m[2],r2=n2*(1-p2/100);return steps(['Уменьшение на '+fmt(p2)+'%: умножаем на 1 − '+fmt(p2/100),fmt(n2)+' · '+fmt(1-p2/100)+' = '+fmt(r2)],fmt(r2));}
  return null;
}

function solveGeometry(q){
  var s=normalizeMathText(q),a=nums(q),r;
  if(/треуголь|сторон/.test(s)&&a.length>=3){
    var x=a[0],y=a[1],z=a[2]; if(x+y<=z||x+z<=y||y+z<=x)return errMsg('Такой треугольник не существует: нарушено неравенство треугольника');
    var hp=(x+y+z)/2,area=Math.sqrt(hp*(hp-x)*(hp-y)*(hp-z));
    return steps(['Распознаны стороны треугольника: '+fmt(x)+', '+fmt(y)+', '+fmt(z),'Полупериметр p = ('+fmt(x)+' + '+fmt(y)+' + '+fmt(z)+') / 2 = '+fmt(hp),'Формула Герона: S = √(p(p−a)(p−b)(p−c))','S = '+fmt(area)],'площадь = '+fmt(area));
  }
  if(/круг|окружност/.test(s)&&a.length>=1){
    r=a[0]; var areaC=Math.PI*r*r,len=2*Math.PI*r;
    return steps(['Радиус r = '+fmt(r),'Площадь круга: S = πr² = '+fmt(areaC),'Длина окружности: C = 2πr = '+fmt(len)],(/длин|периметр|окружност/.test(s)?'C = '+fmt(len):'S = '+fmt(areaC)));
  }
  if(/прямоуголь|квадрат/.test(s)&&a.length>=1){
    var w=a[0],h=/квадрат/.test(s)&&a.length===1?w:a[1];
    if(h===undefined)return null; var ar=w*h,per=2*(w+h);
    return steps(['Стороны: '+fmt(w)+' и '+fmt(h),'Площадь S = a·b = '+fmt(ar),'Периметр P = 2(a+b) = '+fmt(per)],/периметр/.test(s)?'P = '+fmt(per):'S = '+fmt(ar));
  }
  if(/гипотенуз|пифагор|катет/.test(s)&&a.length>=2){
    var aa=a[0],bb=a[1],cc=Math.sqrt(aa*aa+bb*bb);
    return steps(['Теорема Пифагора: c² = a² + b²','c = √('+fmt(aa)+'² + '+fmt(bb)+'²) = '+fmt(cc)],'c = '+fmt(cc));
  }
  return null;
}

function solve(raw){
  var q=raw.trim(),ctx={degrees:!/\bрад|radian/i.test(q)};
  try{
    var pct=solvePercent(q); if(pct)return pct;
    var geom=solveGeometry(q); if(geom)return geom;
    if(q.indexOf('=')>=0)return solveEquation(normalizeMathText(q),ctx);
    var res=evalExpression(q,ctx),val=res.value;
    var explain=['Безопасно разбираем выражение на числа, операции, функции и скобки: '+astText(res.ast)];
    if(/[a-zа-я√π%]/i.test(q))explain.push('Поддержаны функции/константы/проценты без eval или Function(). Тригонометрия по умолчанию считается в градусах.');
    explain.push(astText(res.ast)+' = '+fmt(val));
    return steps(explain,fmt(val));
  }catch(e){
    return errMsg('Не удалось решить запрос: '+e.message);
  }
}

initName();
</script>
